openapi: 3.1.0
info:
  title: Nexus Assets API — 004 增量
  version: 0.4.0
  description: >
    状态从常量变成数据带来的契约变化。**这是一份增量，不是全量。**
    完整的端点清单见 specs/001-asset-ledger-demo/contracts/openapi.yaml（已就地更新）；
    本文件只列出新增与变化的路径，变化的动机见同目录 README.md。
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: metadata

paths:
  # ---------------- 新增：状态列表与新建 ----------------
  /statuses:
    get:
      tags: [metadata]
      summary: 状态列表，按 sort 升序
      description: >
        每一个渲染状态的界面都读这里：徽章的颜色、下拉框的选项、筛选栏、概览卡片、
        流转时间线。标签此前在前端 i18n 与 CSV 导出器里各存一份 ——
        那是一处等着漂移的重复，现在只有这一个来源。
        响应是裸数组：占用统计另有端点，因为读徽章的页面一个也不关心删除的代价。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
    post:
      tags: [metadata]
      summary: 新建自定义状态
      description: >
        `builtin` 恒为 false，不接受客户端指定；`sort` 由服务端排在现有全部之后。
        `counts_as_available` 缺省为 true —— 例外是报废，不是常态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label]
              properties:
                key:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{0,31}$"
                  description: 建成后不可更改。它出现在 URL 与 CSV 里
                label: { type: string }
                color:
                  type: string
                  default: slate
                  enum: [slate, green, blue, amber, red, violet, teal, rose]
                requires_location: { type: boolean, default: false }
                counts_as_available: { type: boolean, default: true }
                terminal: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "409":
          description: 键名已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: 键名不合规，或颜色不在色板里
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ---------------- 新增：修改与删除 ----------------
  /statuses/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: 修改状态
      description: >
        `label`、`color`、`sort` 对任何状态都可改 —— 「允许设置颜色」已经承认这五个的
        呈现是可配的，只让改色不让改名没有理由。
        `requires_location`、`counts_as_available`、`terminal` 仅对自定义状态生效：
        内置的五个携带系统其他部分依赖的语义，请求里带上这三个字段会被**静默忽略**
        而不是报错，因为它们本就不出现在界面上。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                color: { type: string, enum: [slate, green, blue, amber, red, violet, teal, rose] }
                sort: { type: integer }
                requires_location: { type: boolean }
                counts_as_available: { type: boolean }
                terminal: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "404": { description: Not Found }
        "422": { description: 显示名为空，或颜色不在色板里 }
    delete:
      tags: [metadata]
      summary: 删除自定义状态。内置或仍有设备使用时拒绝
      description: >
        两种拒绝共用 409：内置状态不可删除；当前仍有资产处于该状态时不可删除，
        响应携带 `total`。
        **流转历史里出现过不构成拒绝** —— 那会让一个用过一次的状态永远删不掉，
        而代价只是时间线上显示原始键名而非标签，记录本身一条不少。
        删除前的代价由 GET /status-usage 给出。
      responses:
        "204": { description: Deleted }
        "404": { description: Not Found }
        "409":
          description: 内置状态，或仍有设备处于该状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ---------------- 新增：占用统计 ----------------
  /status-usage:
    get:
      tags: [metadata]
      summary: 各状态的占用情况
      description: >
        `assets` 是当前处于该状态的资产数（删除的拦截理由），
        `history` 是提及该状态的流转记录数（只用于确认框里说明代价）。
        历史按事件去重：一次「在库 → 在库」的换位不该被计两次。
        与 /statuses 分开，理由见 research.md D6。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required: [assets, history]
                  properties:
                    assets: { type: integer }
                    history: { type: integer }

  # ---------------- 变化：概览的状态卡片 ----------------
  /overview:
    get:
      tags: [metadata]
      summary: （已存在）首页概览。本轮 status_counts 的构成有变
      description: >
        `status_counts` 不再固定五项：它按当前配置的状态枚举，并把配置中已不存在、
        但仍有资产持有的状态追加在末尾 —— 少了它们，卡片的和就对不上 `total`。
        `category_distribution` 的排除条件从硬编码的 `status != 'retired'`
        改为按 `counts_as_available` 判定。
      responses:
        "200": { description: OK }

components:
  schemas:
    Status:
      type: object
      required: [key, label, color, sort, builtin, requires_location, counts_as_available, terminal]
      properties:
        key: { type: string, description: 小写字母、数字与下划线；建成后不可改 }
        label: { type: string, description: 显示名。属于数据而非 i18n 常量 }
        color:
          type: string
          description: 色板槽位名，不是像素值。两套主题各自决定它长什么样
          enum: [slate, green, blue, amber, red, violet, teal, rose]
        sort: { type: integer }
        builtin: { type: boolean, description: 内置五个为真；不可删除，行为开关不可改 }
        requires_location: { type: boolean, description: 持有方必须是位置实体 }
        counts_as_available: { type: boolean, description: 计入首页的类别分布 }
        terminal: { type: boolean, description: 终态，不能再转出 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            total: { type: integer, description: 挡住删除的资产总数 }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
