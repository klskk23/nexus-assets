openapi: 3.1.0
info:
  title: Nexus Assets API
  version: 0.1.0
  description: >
    内部路由设备资产台账与流转系统。全局约定（认证、错误 envelope、分页、乐观锁）见 README.md。
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: assets
  - name: transfers
  - name: metadata
  - name: import
  - name: overview

# 权限（013）：十八个开关，一个账号绑一个角色。
#
# **读是开放的**，只有 GET /audit 需要权限 —— 台账的价值在于全员能查，
# 而审计是关于人的。所以没有任何一条查询按调用者收窄：权限只决定按钮按不按得动。
#
# 写操作各自需要下列之一：
#   asset.create / asset.update / asset.delete
#   transfer.create / transfer.update
#   print / import（同时需要 asset.create）/ export
#   schema.manage（类别、字段、绑定、重算）/ model.manage / status.manage
#   holder.create / holder.update / holder.delete / holder.default_stock
#   user.manage / audit.read / role.manage
#
# 缺权限一律 403 + code "forbidden"，message 指明缺哪一个（按界面的叫法）。
# 配置文件里的 NEXUS_ADMIN_API_KEY 永远是管理员；用户建的密钥等同其主人当下的权限。

paths:
  # ---------------- auth ----------------
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 本地账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
          description: 签发 8h JWT
        "401": { $ref: "#/components/responses/Error" }

  /auth/oidc/start:
    get:
      tags: [auth]
      security: []
      summary: 发起 Google OIDC 登录
      responses:
        "302": { description: 重定向至 Google }

  /auth/oidc/callback:
    get:
      tags: [auth]
      security: []
      summary: OIDC 回调。校验签名、email_verified 与域名白名单；域内首次登录自动建号
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: 成功后重定向至首页并下发令牌 }
        "403": { $ref: "#/components/responses/Error" }

  /me:
    get:
      description: >
        除账号本身外，还返回 permissions（该账号有效的权限数组）与 is_admin。
        界面据此禁用按钮；**把关的仍然是每个端点自己**，这一份只是为了不显示
        按不动的希望。
      tags: [auth]
      summary: 当前登录账号
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [auth]
      summary: 修改自己的界面偏好（语言、主题）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lang: { type: string, enum: ["", zh, en], description: 空字符串表示跟随系统 }
                theme: { type: string, enum: ["", light, dark] }
      responses:
        "200": { description: OK，返回更新后的账号 }

  # ---------------- overview ----------------
  /overview:
    get:
      parameters:
        - name: recent
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
          description: >
            最近流转的条数。每条是一个多行块，十条在一个「一眼看完」的页面上已经很长了，
            所以由调用方决定。与其余分页参数一样是钳制而非拒绝：过期的客户端要一千条会得到
            五十条，而不是一个错误。
      tags: [overview]
      summary: 首页概览：状态计数、类别分布、最近流转
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_counts:
                    type: object
                    description: 五种状态各自的台数，含 retired
                    additionalProperties: { type: integer }
                  category_distribution:
                    type: array
                    description: 按顶层类别聚合，计数含全部子类别，排除 retired
                    items:
                      type: object
                      properties:
                        category_id: { type: string }
                        name: { type: string }
                        count: { type: integer }
                  recent_transfers:
                    type: array
                    maxItems: 10
                    description: 最近 10 条；同一 batch_id 折叠为一条
                    items: { $ref: "#/components/schemas/TransferSummary" }

  # ---------------- assets ----------------
  /assets:
    get:
      tags: [assets]
      summary: 资产列表。搜索精确优先、否则子串；支持任意 attr.<key> 等值筛选
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 精确匹配任一唯一字段的当前值或历史值，其次 UUID；未命中则子串匹配 }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: include_descendants, in: query, schema: { type: boolean, default: true } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AssetStatus" } }
        - { name: owner_id, in: query, schema: { type: string } }
        - { name: holder_type, in: query, schema: { type: string, enum: [user, entity] } }
        - { name: holder_id, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Asset" }
                      exact_match_id:
                        type: string
                        nullable: true
                        description: q 唯一精确命中时给出，前端据此直达详情页
    post:
      tags: [assets]
      summary: 创建资产。跑完整保存管线并写 kind=create 流转事件
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [assets]
      summary: 资产详情。含已归档信息项的取值
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [assets]
      summary: 修改属性或变更类别。必须带 version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AssetWrite"
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [assets]
      summary: 硬删并级联流转历史与唯一值。需带 confirm 二次确认（输入该资产的显示编号）
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "422": { $ref: "#/components/responses/Error" }

  /assets/delete:
    post:
      tags: [assets]
      summary: 批量删除。confirm 必须等于选中的台数
      description: >
        POST 而非 DELETE，因为请求带 body —— 带 body 的 DELETE 在各层代理与客户端上
        支持参差，这不是发现这件事的地方。
        单条删除要求逐字输入设备编号，那对一批设备不成立，于是改为要求输入这一批的**数量**：
        确认十二台之前你必须先看清自己选了几台。整批成功或整批失败 ——
        删掉十二台里的九台再失败，操作者无从知道是哪九台。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_ids, confirm]
              properties:
                asset_ids: { type: array, items: { type: string } }
                confirm: { type: string, description: 必须等于 asset_ids 的长度 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /assets/{id}/transfers:
    get:
      tags: [transfers]
      summary: 该资产的完整流转时间线
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }

  # ---------------- transfers ----------------
  /transfers:
    post:
      tags: [transfers]
      summary: 单台或批量流转。多台时生成共享 batch_id，单事务写入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_ids]
              properties:
                asset_ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                to_status: { $ref: "#/components/schemas/AssetStatus" }
                to_holder_type: { type: string, enum: [user, entity] }
                to_holder_id: { type: string }
                to_owner_id: { type: string }
                note: { type: string }
                due_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string, nullable: true }
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/Transfer" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /transfers/{id}:
    patch:
      tags: [transfers]
      summary: 仅链尾事件可编辑；批量事件只能整批改；写入 edited_* 留痕
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_status: { $ref: "#/components/schemas/AssetStatus" }
                to_holder_type: { type: string, enum: [user, entity] }
                to_holder_id: { type: string }
                to_owner_id: { type: string }
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }
        "409": { $ref: "#/components/responses/Error" }

  # ---------------- metadata ----------------
  /categories:
    get:
      tags: [metadata]
      summary: 类别树（可搜索、可分页）
      description: >
        **两种形状，按问题决定**（014 决策 92）：带了 q / offset / limit
        就是要一页，返回 `{items,total,offset,limit}`；一个都不带就是要全部，
        返回数组 —— 下拉框要的是全集，翻页会把选项截断，而 zenith-printer
        的数据源按数组解析 `/api/categories`。
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
      responses:
        "200": { description: OK }
    post: { tags: [metadata], summary: 新建类别, responses: { "201": { description: Created } } }

  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: 改名 / 改 display_key / 移动位置。子树下有资产时拒绝移动
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }

  /categories/{id}/delete:
    delete:
      tags: [metadata]
      summary: （即 DELETE /categories/{id}）删除类别
      description: >
        两种拒绝共用 409：有子类别、子树下有资产。响应携带 blockers 与 total，
        逐条给出挡住它的对象。
        随类别一并删除的有两样：它自己的字段绑定（描述的正是这个类别要求记录什么），
        以及型号关联 —— 型号本身保留。型号关联不作为拒绝理由，因为界面上没有任何
        地方能解除关联，那会让拒绝无路可走；「未关联任何类别的型号」本来就是合法状态。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /categories/{id}/schema:
    get:
      tags: [metadata]
      summary: 该类别的有效信息项集（祖先并集、必填、排序、options）与它选定的显示编号
      description: 动态表单、筛选器与 CSV 模板的唯一数据源
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { $ref: "#/components/schemas/Category" }
                  fields:
                    type: array
                    items: { $ref: "#/components/schemas/FieldSchema" }

  /categories/{id}/recompute:
    post:
      tags: [metadata]
      summary: 重算该类别子树内所有资产的表达式键
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: dry_run 时返回影响面与冲突清单；执行时任一冲突即整体回滚
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected: { type: integer }
                  total: { type: integer }
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        value: { type: string }
                        assets: { type: array, items: { type: string } }
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        asset: { type: string }
                        key: { type: string }
                        from: { type: string }
                        to: { type: string }
                  applied: { type: boolean }

  /categories/{id}/import-template.csv:
    get:
      tags: [import]
      summary: 双行表头的导入模板（首行中文 label，次行机器 key）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }

  /fields:
    get:
      tags: [metadata]
      summary: 字段库（可按类别筛选、分页）
      parameters:
        - { name: category_id, in: query, schema: { type: string, description: 该类别的有效字段（含继承） } }
        - { name: type, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
      responses:
        "200":
          description: OK，items 的每一项额外带 category_ids（该字段绑定到的类别）
    post:
      tags: [metadata]
      summary: 新建字段，可同时绑定类别
      description: >
        `category_ids` 在同一个事务里完成绑定：字段不绑定到类别就不会出现在任何录入表单上，
        所以"建好再去绑"本来就是同一件事的两半。绑定被拒绝（键名已在该链上、
        表达式的输入没绑）时**字段也不会被创建** —— 半个结果不值得留下。
        `required` 作用于这一批绑定，它是写入时的规则：存量资产不回溯校验。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, label, type]
              properties:
                key: { type: string }
                label: { type: string }
                type:
                  type: string
                  enum: [text, number, boolean, date, mac, ip, url, computed]
                options: { type: object }
                is_unique: { type: boolean }
                category_ids: { type: array, items: { type: string } }
                required: { type: boolean }
      responses:
        "201": { description: Created }
        "409": { $ref: "#/components/responses/Error" }

  /fields/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: 修改信息项。不再接受 archive —— 停用机制已移除
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metadata]
      summary: 删除信息项。有引用或有资产取值时拒绝
      description: >
        取代停用。被表达式键引用或被某类别选作显示编号时返回 409 并附 referrers；
        有资产填了非空值时返回 409 并附 blockers 与 total，提示改为从类别上解绑。
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }

  /fields/{id}/referrers:
    get:
      tags: [metadata]
      summary: 列出正在引用该信息项的表达式键与类别显示编号
      description: 供界面在用户尝试删除之前就把阻挡对象摆出来，而不是等操作被拒绝
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string, enum: [field, display_key] }
                    id: { type: string }
                    label: { type: string }

  /categories/{id}/bindings:
    post:
      tags: [metadata]
      summary: 绑定信息项到类别
      description: >
        绑定表达式键时递归校验依赖闭包：闭包内每一项都必须已绑定，其中的静态键
        还必须已标为必填，否则 422 并分类列出要先改什么。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_id]
              properties:
                field_id: { type: string }
                required: { type: boolean, default: false }
                sort: { type: integer, default: 0 }
      responses:
        "204": { description: Bound }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /categories/{id}/bindings/{field_id}:
    delete:
      tags: [metadata]
      summary: 从类别解绑信息项。存量取值保留为孤儿键
      description: >
        信息项没有停用机制，所以解绑是「不再需要某个字段但要留住存量数据」的唯一路径。
        沿用绑定侧的护栏：被表达式键读取、或被选作显示编号时拒绝。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: field_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Unbound }
        "409": { $ref: "#/components/responses/Error" }

  /models:
    get:
      tags: [metadata]
      summary: 型号列表（可按类别筛选、可搜索、可分页）
      description: >
        **两种形状，按问题决定**（014 决策 92）：带了 q / offset / limit
        就是要一页，返回 `{items,total,offset,limit}`；一个都不带就是要全部，
        返回数组 —— 下拉框要的是全集，翻页会把选项截断，而 zenith-printer
        的数据源按数组解析 `/api/categories`。
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
        - { name: category_id, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
    post: { tags: [metadata], summary: 新建型号, responses: { "201": { description: Created } } }

  /models/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: 修改型号。字段可省略，省略即不动；category_ids 给了则整体替换
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metadata]
      summary: 删除型号。仍有设备是该型号时拒绝（带 total）；类别关联一并解除
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }

  /models/{id}/usage:
    get:
      tags: [metadata]
      summary: 删除该型号的代价：{assets}
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

  /statuses:
    get:
      tags: [metadata]
      summary: 状态列表（可搜索、可分页）
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
      description: >
        形状按问题决定，与其他元数据列表同一条规则（014 决策 92）：
        带了 q / offset / limit 就是一页信封，一个都不带就是今天的数组。

        每一个渲染状态的界面都读这里：徽章的颜色、下拉框的选项、筛选栏、
        概览卡片、流转时间线。标签不再由前端与导出各存一份。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
    post:
      tags: [metadata]
      summary: 新建状态
      description: >
        key 只能是小写字母、数字与下划线；color 必须是色板里的名字，不接受十六进制。
        新建的状态 builtin 恒为 false，sort 排在现有全部之后。
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Error" }

  /statuses/{key}:
    patch:
      tags: [metadata]
      summary: 修改状态
      description: >
        label、color、sort 任何状态都可改。requires_location、counts_as_available、
        terminal 三个行为开关**仅对自定义状态生效**：内置的五个携带系统写死的语义，
        请求里带上这三个字段会被静默忽略而不是报错 —— 它们本就不出现在界面上。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metadata]
      summary: 删除状态
      description: >
        两种拒绝共用 409：内置状态不可删除；当前仍有资产处于该状态时不可删除，
        响应携带 total。**历史记录里出现过不构成拒绝** —— 那样会让一个用过一次的
        状态永远删不掉，而代价只是时间线上显示键名而非标签，数据本身不丢。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /status-usage:
    get:
      tags: [metadata]
      summary: 各状态的占用情况
      description: >
        key -> { assets, history }。assets 是当前处于该状态的资产数（删除的拦截理由），
        history 是提及该状态的流转记录数（只用于确认框里说明代价）。
        与 /statuses 分开，因为只有状态管理页需要它，而 /statuses 每个页面都在读。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    assets: { type: integer }
                    history: { type: integer }

  /holders:
    get:
      tags: [metadata]
      summary: 持有方实体树（可筛选、可搜索、可分页）
      description: >
        **两种形状，按问题决定**（014 决策 92）：带了 q / offset / limit
        就是要一页，返回 `{items,total,offset,limit}`；一个都不带就是要全部，
        返回数组 —— 下拉框要的是全集，翻页会把选项截断，而 zenith-printer
        的数据源按数组解析 `/api/categories`。
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
        - { name: type, in: query, schema: { type: string, enum: [company, department, location] } }
        - { name: is_default_stock, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HolderEntity" } }
    post:
      tags: [metadata]
      summary: 新建持有方实体
      description: >
        `parent_id` 按类型校验：部门必须属于一个公司；位置可以属于公司或部门，也可以不属于；
        公司不能有上级。不合规时 422，消息挂在 `parent_id` 上。
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Error" }

  /holders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [metadata]
      summary: 删除持有方。被持有、被引用、有下级或是默认库存点时拒绝
      description: >
        取代 006 之前的 `archive: true`。三种拒绝共用 409：有设备（带 blockers 与 total）、
        有下级（带 total）、是默认库存点。仅在流转历史中出现**不**构成拒绝，
        代价由 GET /holders/{id}/usage 给出。
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [metadata]
      summary: 改名 / 改备注 / 移动 / 标记默认库存点。被持有或被引用时拒绝删除
      description: >
        `name`、`note`、`parent_id` 可单独或一起提交。`parent_id` 用 JSON null 表示
        「脱离上级」，字段缺席表示「不动」—— 二者必须可区分，否则改备注会顺手把上级清掉。
        移动时同样校验类型，并拒绝成环。
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /holders/{id}/usage:
    get:
      tags: [metadata]
      summary: 删除该持有方的代价：{assets, children, history}
      description: >
        前两个是拒绝的理由，history 只用于确认框事先说明代价。
        对不存在的持有方返回 404，而不是一组全零 —— 全零读起来像「可以安全删除」。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

  /roles:
    get:
      tags: [metadata]
      summary: >
        角色清单，每项带 users（绑着多少账号）。**读是开放的** ——
        账号页要显示同事在哪个角色上，藏起来会让「他为什么能做那个」无从回答。
        响应里的 permissions 是这套系统认识的全部开关。
        **这一个列表始终是信封** —— 它从来就带着 permissions，没有数组形状要保。
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
      responses:
        "200": { description: OK }
    post:
      tags: [metadata]
      summary: 新建角色。新角色永远不是管理员 —— 无限权限的角色只需要一个
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }

  /roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: >
        改角色。**管理员的 permissions 不可编辑** ——
        它不是十八个勾，而是「全部，含以后新增的」；改名可以。
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [metadata]
      summary: 删除角色。还绑着账号时拒绝，并说明有几个 —— 与删持有方、删状态同一条规则
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}/role:
    patch:
      tags: [metadata]
      summary: >
        把账号绑到角色上。两条守卫：**系统必须始终至少有一个启用的管理员**
        （降级、停用、删角色三条路都撞它），以及**不能改自己的角色**。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string }
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }

  /users:
    get:
      tags: [metadata]
      summary: 账号列表（可按角色与启用状态筛选、可搜索、可分页）
      description: >
        形状按问题决定（014 决策 92）：带了 q / offset / limit 是一页信封，
        一个都不带是数组 —— 流转对话框的负责人下拉要的是全集。
      parameters:
        - { $ref: "#/components/parameters/ListQ" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListLimit" }
        - { name: role_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
      responses:
        "200": { description: OK }
    post: { tags: [metadata], summary: 新建本地账号, responses: { "201": { description: Created } } }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [metadata]
      summary: 改名 / 停用 / 启用
      description: >
        三态，与其他 patch 同一条规则：字段缺席=不动，给了=照做。
        `disable: true` 停用（名下仍有资产、或是最后一个管理员时拒绝），
        `disable: false` 启用（014 决策 93 —— 此前它被读了但被忽略，
        误停一个同事只能去改数据库）。`name` 可改，**邮箱不可改**：
        它是 OIDC 登录的匹配依据，也是流水里的身份。
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [metadata]
      summary: 重置密码，并当场吊销该账号的全部会话
      description: >
        仅本地账号；OIDC 账号 422（没有可重置的密码，给它设一个等于开第二道门）。
        成功时 `users.token_version + 1` 且 `sessions` 里该账号的刷新令牌全部作废
        （014 决策 94）。少了这一半，重置只是换了个哈希：那人手上的访问令牌
        15 分钟内继续有效、刷新令牌一直有效 —— 而管理员按这个按钮，
        多半正是因为这个账号出事了。
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /audit:
    get:
      tags: [metadata]
      summary: 元数据变更流水
      parameters:
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string, description: 只看某个操作人的变更 } }
        - { name: action, in: query, schema: { type: string, enum: [create, update, archive, delete, recompute] } }
        - { name: q, in: query, schema: { type: string, description: 搜索操作人姓名与对象编号；不搜对象名称，流水记的是改了什么，不是它当时叫什么 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: OK }

  # ---------------- import / export ----------------
  /fields/{id}/recompute:
    post:
      tags: [metadata]
      summary: 让存量取值与该字段的表达式一致（覆盖所有绑定它的类别）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
      responses:
        "200": { description: OK，返回与类别重算相同的报告 }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 用 HttpOnly Cookie 换一张新的访问令牌（每次调用都轮换刷新令牌）
      responses:
        "200": { description: OK，返回 token 与 user }
        "401": { description: 刷新令牌无效、过期、已吊销，或是一次重放 }

  /auth/logout:
    post:
      tags: [auth]
      summary: 结束本设备的会话（其他设备不受影响）
      responses:
        "204": { description: No Content }

  /api-keys:
    get:
      tags: [auth]
      summary: 当前账号的 API 密钥（不含明文）
      responses:
        "200": { description: OK }
    post:
      tags: [auth]
      summary: 新建密钥，明文只在这一次响应里出现
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                days: { type: integer, description: 有效期天数，0 表示长期有效 }
      responses:
        "201": { description: Created，返回 key 与 secret }

  /api-keys/{id}:
    delete:
      tags: [auth]
      summary: 撤销密钥
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: No Content }

  /rows:
    get:
      tags: [metadata]
      summary: 资产的表格视图（列名是字段键，供外部系统消费）
      description: >
        export.csv 的 JSON 兄弟。列名用字段键而不是显示名，所以消费方绑定的东西不会因为
        有人改了显示名而失效。必须指定类别：字段键只在一个类别的链内唯一。
        内建列：sys_id、sys_sn、sys_category、sys_status、sys_holder、sys_owner、
        sys_model、sys_vendor、sys_note、sys_created_at。
      parameters:
        - { name: category_id, in: query, required: true, schema: { type: string } }
        - { name: include_descendants, in: query, schema: { type: boolean, default: true } }
        - { name: ids, in: query, schema: { type: string, description: 逗号分隔的资产 id，用于"只要这几台" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: holder_id, in: query, schema: { type: string } }
        - { name: owner_id, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns: { type: array, items: { type: string } }
                  rows:
                    type: array
                    items: { type: object, additionalProperties: { type: string } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  generated_at: { type: string, format: date-time }
        "422": { description: 未指定类别 }

  /health:
    get:
      tags: [metadata]
      summary: >
        这个进程还能不能读到自己的数据库。**不需要凭证** ——
        读它的是容器运行时与反向代理，两者都不持有凭证。
        问的不是"端口通不通"，那是卡死的部署也能通过的检查。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, description: 构建时打进二进制的版本，未发布的构建是 dev }
        "503": { description: 进程活着但读不到数据库 }

  /capabilities:
    get:
      tags: [metadata]
      summary: 这套部署具备哪些可选能力：printing 是否可用、printing_url 打印服务地址
      responses:
        "200": { description: OK }

  /print:
    post:
      tags: [metadata]
      summary: 把选中的资产送去打标签，按类别拆成多个作业
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
                copies: { type: integer, minimum: 1 }
                presets:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    每个类别打哪一种标签，键是类别 id。只有一种标签的类别可以不给；
                    有多种而不给（或给了不属于该类别的），这一批会被拒绝而不是替你猜。
                dry_run:
                  type: boolean
                  description: >
                    只核对不打印：返回与真打完全相同的分批与拒绝，但不联系打印服务。
                    界面用它做出纸前的确认。
      responses:
        "200":
          description: >
            每个类别一个批次，含 numbers（这一批要打的设备编号，供出纸前核对）、
            presets（该类别可用的标签，供试算时选择，每项带 templateId 以便链到那张标签本身）
            与 preset_id/preset_name。批次里没有 job_id 而有 error，表示这一批没有送出去
            （没配预设、或打印服务拒绝），其余批次照常提交。
        "404": { description: 本部署没有配置打印服务 }

  /print/presets:
    get:
      tags: [metadata]
      summary: >
        转发打印服务的预设清单，用于把"预设 id"变成一个下拉框。
        每项带 templateId，界面据此拼出 {printing_url}/design/{templateId}
      responses:
        "200": { description: OK }
        "404": { description: 本部署没有配置打印服务 }

  /print/jobs/{id}:
    get:
      tags: [metadata]
      summary: 转发打印服务的作业状态（打印服务不发 CORS 头，浏览器不能直接问）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /import/preview:
    post:
      tags: [import]
      summary: 上传 CSV 逐行校验，不写入任何数据
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category_id: { type: string }
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 预览句柄，commit 时回传 }
                  total: { type: integer }
                  ok: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        status: { type: string, enum: [ok, error] }
                        fields:
                          type: object
                          additionalProperties: { type: string }

  /import/commit:
    post:
      tags: [import]
      summary: 确认导入。单事务，任一行失败即全部回滚。每行写一条 kind=create 事件，共享 batch_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  batch_id: { type: string }
        "422": { $ref: "#/components/responses/Error" }

  /export.csv:
    get:
      tags: [import]
      summary: >
        按当前筛选条件导出。其余查询参数与 GET /assets 一致。
        **必须指定类别**：固定九列（编号、类别、状态、持有方、负责人、型号、厂商、备注、建档时间）之外的列是那个类别自己的字段，
        混着导出的表格里没有任何一列能把两台设备区分开。
      parameters:
        - name: ids
          in: query
          schema: { type: string }
          description: >
            逗号分隔的资产 id —— 勾选导出。给了它就**不看筛选也不看 category_id**：
            勾的是设备本身。跨多个类别时**每个类别一份 CSV，打包成 zip**
            （固定列之外的列是各自类别的字段，一张表放不下两种）；
            只有一个类别时就是一份 CSV。每份都含该类别的全部字段，`fields` 对它无效。
        - name: category_id
          in: query
          schema: { type: string }
          description: 除非给了 ids，否则必填
        - name: fields
          in: query
          schema: { type: string }
          description: >
            逗号分隔的字段键，决定导出哪几列自定义字段。
            **不给**＝该类别的全部字段；**给空串**＝一列都不要，只留固定九列。
            两者是不同的请求，不要合并。
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
            application/zip:
              schema: { type: string, format: binary, description: 勾选跨多个类别时，每类别一个 CSV }
        "422": { description: 没有指定类别，或勾选为空 }

components:
  parameters:
    ListQ:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: >
        搜索词，大小写不敏感、匹配该资源自己声明的几个字段（014 决策 90）。
        **给了 q 就是要一页**，回应是信封。
    ListOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }
    ListLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 50, maximum: 200 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, example: "en-GB,en;q=0.9" }
      description: >
        **每一个端点**都读它（006 起）。支持 zh 与 en，按前缀匹配；
        不支持的语言回退到中文。它决定 error.message、error.fields 的**值**、
        CSV 表头、导入模板的标题行与导入预览的问题描述。
        **不影响** error.code、error.fields 的**键**、导入模板的键名行，
        以及任何数据（类别名、状态标签、信息项显示名）。

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: 统一错误 envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    HolderEntity:
      type: object
      required: [id, type, name, parent_id, note, is_default_stock]
      properties:
        id: { type: string }
        type: { type: string, enum: [company, department, location] }
        name: { type: string }
        parent_id:
          type: [string, "null"]
          description: 部门必须有；位置可有可无；公司恒为 null
        note: { type: string, description: 货架区间、联系人、用途 —— 运维自己要记的东西 }
        is_default_stock: { type: boolean }
        # archived_at 自 006 移除：停用机制不复存在，可删除取代了它

    Status:
      type: object
      required: [key, label, color, sort, builtin]
      properties:
        key: { type: string, description: 小写字母、数字与下划线；建成后不可改 }
        label: { type: string, description: 显示名。中文文案，属于数据而非 i18n 常量 }
        color:
          type: string
          description: 色板槽位名，不是像素值。两套主题各自决定它长什么样
          enum: [slate, green, blue, amber, red, violet, teal, rose]
        sort: { type: integer }
        builtin: { type: boolean, description: 内置五个为真；不可删除，两个行为开关不可改 }
        # requires_location 自 007 移除：状态不再约束持有方的种类。
        # 默认库存点仍必须是位置 —— 那是另一条规则，归还需要指向具体的地方

        counts_as_available: { type: boolean, description: 计入首页的类别分布 }
        terminal: { type: boolean, description: 终态，不能再转出 }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 英文 snake_case }
            message: { type: string, description: 中文，用户可见 }
            fields:
              type: object
              additionalProperties: { type: string }

    Page:
      type: object
      required: [items, total, offset, limit]
      properties:
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    AssetStatus:
      type: string
      enum: [in_stock, in_use, in_repair, lost, retired]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        auth_type: { type: string, enum: [oidc, local] }
        status: { type: string, enum: [active, disabled] }

    HolderRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, entity] }
        id: { type: string }
        name: { type: string, readOnly: true }
        entity_type:
          type: string
          nullable: true
          description: type=entity 时给出 company / location / department

    Asset:
      type: object
      properties:
        id: { type: string, description: UUID，唯一内部标识 }
        display_name: { type: string, description: 由类别 display_key 求值得到；未配置时为 UUID 前 8 位 }
        category_id: { type: string }
        model_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AssetStatus" }
        owner: { $ref: "#/components/schemas/User" }
        holder: { $ref: "#/components/schemas/HolderRef" }
        attrs:
          type: object
          additionalProperties: true
        note:
          type: string
          description: >
            这台设备自己的备注 —— 与任何类别的字段集无关。
            **不是流转上的备注**：那一条解释某次移动且不可修改，这一条描述设备当下的情况，随设备一起编辑
        archived_attrs:
          type: object
          description: 不属于当前有效信息项集的孤儿键，只读展示
          additionalProperties: true
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssetWrite:
      type: object
      required: [category_id, owner_id, holder_type, holder_id]
      properties:
        category_id: { type: string }
        model_id: { type: string, nullable: true }
        owner_id: { type: string }
        holder_type: { type: string, enum: [user, entity] }
        holder_id: { type: string }
        status: { $ref: "#/components/schemas/AssetStatus" }
        attrs:
          type: object
          description: 不含 computed 项，由服务端求值
          additionalProperties: true
        note:
          type: string
          nullable: false
          description: >
            设备自己的备注。**字段缺席 = 不动**（一次流转或改属性不该把它抹掉），
            给空串则清空
        transfer_note:
          type: string
          description: 这次保存若产生了流转事件，写在那条事件上的说明。不可事后修改

    Category:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        parent_id: { type: string, nullable: true }
        path: { type: string, description: 物化路径，形如 /root/child/self/ }
        display_key:
          type: string
          description: >
            指向该类别有效字段集内某个标为唯一的信息项 key，空串表示未设置。
            不沿祖先链继承；未设置时资产以 UUID 前 8 位指代

    ProductModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        vendor: { type: string, description: 非 null，可为空串。与 name 一起构成重名判定 }
        category_ids:
          type: array
          items: { type: string }
          description: >
            该型号出现在哪些类别的录入表单里。候选范围是「关联到本类别或其任一祖先」，
            与字段继承同一套心智模型；关联在子孙上的型号，父类的资产看不见
        attr_defaults: { type: object, additionalProperties: true }
        archived_at: { type: string, nullable: true }

    FieldSchema:
      type: object
      properties:
        key: { type: string }
        label: { type: string, description: 中文，用户可见 }
        type:
          type: string
          enum: [text, number, boolean, date, mac, ip, url, computed]
        required: { type: boolean }
        is_unique: { type: boolean }
        sort: { type: integer }
        inherited_from:
          type: string
          nullable: true
          description: 继承自哪一级类别，本级绑定时为 null
        options:
          type: object
          description: 形状由 type 决定，见 data-model.md
          additionalProperties: true

    TransferSummary:
      type: object
      properties:
        batch_id: { type: string, nullable: true }
        kind: { type: string }
        asset_count: { type: integer }
        actor: { $ref: "#/components/schemas/User" }
        created_at: { type: string, format: date-time }

    Transfer:
      type: object
      properties:
        id: { type: string }
        asset_id: { type: string }
        batch_id: { type: string, nullable: true }
        kind:
          type: string
          enum: [create, checkout, checkin, transfer, reassign, status_change]
        from_status: { type: string, nullable: true }
        from_holder: { $ref: "#/components/schemas/HolderRef" }
        from_owner_id: { type: string, nullable: true }
        to_status: { $ref: "#/components/schemas/AssetStatus" }
        to_holder: { $ref: "#/components/schemas/HolderRef" }
        to_owner_id: { type: string }
        note: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        actor: { $ref: "#/components/schemas/User" }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        edited_by: { type: string, nullable: true }
