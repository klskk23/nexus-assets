name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---- The frontend, before anything Go ----
      #
      # `web/embed.go` embeds `web/dist`, so every Go step -- vet, lint, test --
      # needs the bundle to exist. It is gitignored, so a developer's machine
      # always has one and a clean checkout never does: the first run of this
      # workflow died in `go vet` with "pattern all:dist: no matching files".
      - name: install web deps
        run: cd web && npm ci

      - name: build the frontend
        run: cd web && npm run build && test -f dist/index.html

      # ---- Gate 1: Go formatting, vet and lint ----
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./migrations)" || (gofmt -l ./cmd ./internal ./migrations && exit 1)

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      # Installed with the runner's own toolchain rather than downloaded.
      # golangci-lint refuses to run when the Go it was built with is older
      # than the version go.mod targets, and the action's pinned binary was
      # built with 1.24 against a tree that says 1.26 -- so `version: latest`
      # meant "latest the action knows", not "latest there is". Building it
      # here cannot drift from the toolchain that way.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

      # ---- Gate 2: TypeScript and ESLint ----
      - name: tsc
        run: cd web && npx tsc --noEmit

      - name: eslint
        run: cd web && npx eslint .

      # ---- Gate 3: Go tests plus core pipeline coverage >= 80% ----
      - name: go test
        run: go test ./cmd/... ./internal/...

      - name: core pipeline coverage
        run: |
          go test -coverprofile=c.out ./internal/schema/... ./internal/asset/... ./internal/compute/...
          total=$(go tool cover -func=c.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "core pipeline coverage: $total%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80) ? 0 : 1 }' || {
            echo "coverage below the 80% required by constitution principle II"
            exit 1
          }

      # ---- Gate 4: frontend tests including DOM tests ----
      - name: vitest
        run: cd web && npx vitest run

      # ---- Gate 5: reconciliation ----
      #
      # On a database this step creates, with a throwaway secret. The process
      # refuses to start without one rather than generating a key that would
      # change on every restart -- so a runner with no .env has to supply it,
      # and locally this gate only passed by reading the developer's own.
      - name: build and verify
        env:
          NEXUS_JWT_SECRET: ci-gate-secret-not-for-any-deployment
          # Required too: the admission whitelist has no default, on purpose --
          # a deployment that let every domain in by omission is the one
          # mistake this setting exists to make impossible.
          NEXUS_ALLOWED_EMAIL_DOMAINS: example.com
          NEXUS_DB_PATH: ${{ runner.temp }}/verify.db
        run: |
          CGO_ENABLED=0 go build -o nexus ./cmd/nexus
          ./nexus verify

      # ---- Gate 6: no unapproved custom components ----
      - name: custom component guard
        run: |
          count=$(find web/src/components/custom -name '*.tsx' 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found $count custom component(s); each needs prior developer approval"
            find web/src/components/custom -name '*.tsx'
            grep -L "Approved by developer" $(find web/src/components/custom -name '*.tsx') && exit 1
          fi
          echo "no custom components"

      # ---- Constitution principle IV: initial chunk budget ----
      - name: bundle budget
        run: |
          max=512000
          largest=$(find web/dist/static -name 'index-*.js' -exec gzip -c {} \; | wc -c)
          echo "initial chunk gzip size: $largest bytes (budget $max)"
          [ "$largest" -le "$max" ] || exit 1
